# Nginx config for hoan.bhquan.store (PDHOAN PIPSNOTE)
# Copy to VPS: /etc/nginx/sites-available/hoan.bhquan.store
# Then: ln -s /etc/nginx/sites-available/hoan.bhquan.store /etc/nginx/sites-enabled/
# Test: nginx -t
# Reload: systemctl reload nginx

upstream pipsnote_upstream {
    server 127.0.0.1:5601;
    keepalive 32;
}

# HTTP → HTTPS redirect
server {
    listen 80;
    listen [::]:80;
    server_name hoan.bhquan.store;

    # Certbot ACME challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$server_name$request_uri;
    }
}

# HTTPS main
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name hoan.bhquan.store;

    # SSL certificates (run certbot first if not exist)
    ssl_certificate /etc/letsencrypt/live/hoan.bhquan.store/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/hoan.bhquan.store/privkey.pem;

    # SSL security
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384';
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # Max upload size
    client_max_body_size 20M;

    # Logs
    access_log /var/log/nginx/pipsnote_access.log;
    error_log /var/log/nginx/pipsnote_error.log warn;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;

    # Proxy to pipsnote-app container (port 5601)
    location / {
        proxy_pass http://pipsnote_upstream;
        proxy_http_version 1.1;

        # WebSocket support
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';

        # Standard proxy headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;

        # Cache bypass
        proxy_cache_bypass $http_upgrade;

        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;

        # Buffer settings
        proxy_buffering off;
        proxy_request_buffering off;
    }

    # Next.js static files (cache headers)
    location /_next/static/ {
        proxy_pass http://pipsnote_upstream;
        proxy_cache_valid 200 60m;
        add_header Cache-Control "public, max-age=3600, immutable";
    }

    # Favicon, robots.txt
    location = /favicon.ico {
        proxy_pass http://pipsnote_upstream;
        access_log off;
    }

    location = /robots.txt {
        proxy_pass http://pipsnote_upstream;
        access_log off;
    }
}
