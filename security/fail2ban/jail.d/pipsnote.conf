# security/fail2ban/jail.d/pipsnote.conf
#
# Cai dat: copy vao /etc/fail2ban/jail.d/pipsnote.conf tren VPS, copy 2 file filter.d/*.conf
# vao /etc/fail2ban/filter.d/, roi `systemctl restart fail2ban`.
#
# QUAN TRONG: sua logpath cho dung duong dan Nginx access log THAT cua vhost pipsnote
# tren shared-nginx (vd /var/log/nginx/pipsnote-access.log neu co log rieng theo domain,
# hoac path trong volume mount cua container shared-nginx).

[pipsnote-admin-login]
enabled  = true
filter   = pipsnote-admin-login
logpath  = /var/log/nginx/pipsnote-access.log
port     = http,https
maxretry = 10
findtime = 600
bantime  = 3600
action   = iptables-multiport[name=pipsnote-admin-login, port="http,https", protocol=tcp]

[pipsnote-scan]
enabled  = true
filter   = pipsnote-scan
logpath  = /var/log/nginx/pipsnote-access.log
port     = http,https
maxretry = 15
findtime = 300
bantime  = 86400
action   = iptables-multiport[name=pipsnote-scan, port="http,https", protocol=tcp]
