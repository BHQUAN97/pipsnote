# security/fail2ban/filter.d/pipsnote-admin-login.conf
#
# Phat hien brute-force dang nhap /admin/login: match request POST toi endpoint login
# tra ve 401/429 trong Nginx access log (log format: xem jail.d/pipsnote.conf).
#
# YEU CAU: Nginx phai ghi REAL client IP (khong phai IP cua Cloudflare edge) —
# bat buoc cau hinh `set_real_ip_from`/`real_ip_header CF-Connecting-IP` truoc
# (xem docs/SECURITY_DETECTION.md muc 2), neu khong fail2ban se ban nham IP Cloudflare.

[Definition]
failregex = ^<HOST> -.*"POST /(admin/login|api/auth/login) HTTP/[0-9.]+" (401|429) .*$
ignoreregex =
