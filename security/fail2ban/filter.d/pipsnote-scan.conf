# security/fail2ban/filter.d/pipsnote-scan.conf
#
# Phat hien scanning/probing pho bien: request toi cac path khong ton tai tren
# stack Next.js (WordPress, phpMyAdmin, .env, .git...) hoac 404 spam tan suat cao.
# Day KHONG phai loi ung dung — la dau hieu bot do scan lo hong, ban ngay khi thay.

[Definition]
failregex = ^<HOST> -.*"(GET|POST|HEAD) .*(wp-login|wp-admin|wp-content|phpmyadmin|\.env|\.git/|xmlrpc\.php|\.aws/credentials|config\.php|vendor/phpunit|\.well-known/security\.txt).* HTTP/[0-9.]+" [0-9]{3} .*$
            ^<HOST> -.*" (404) .*$
ignoreregex = ^<HOST> -.*"GET /(favicon\.ico|robots\.txt|sitemap\.xml) HTTP/[0-9.]+" 404 .*$
