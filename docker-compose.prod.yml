# docker-compose.prod.yml — pipsnote production, shared-infra VPS
#
# Dung chung shared-mysql + shared-nginx (co san tren VPS tu NoiThat2026/VietNet2026).
# Redis + Meilisearch la container RIENG cua pipsnote (khong nam trong shared-infra),
# internal-only — khong bao gio lo ra ngoai (dung nguyen tac §10.2 spec).
#
# shared-nginx proxy vao pipsnote-app qua 127.0.0.1:5600 (vhost config nam ngoai repo nay,
# cau hinh tren VPS — xem DEPLOY.md).

services:
  pipsnote-app:
    build: .
    container_name: pipsnote-app
    env_file: .env
    ports:
      - "127.0.0.1:5600:3000"
    networks:
      - webphoto_backend   # network shared co san — cham toi shared-mysql
      - pipsnote_internal  # cham toi redis/meilisearch cua rieng pipsnote
    depends_on:
      redis:
        condition: service_started
      meilisearch:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    mem_limit: 1g
    cpus: 1.0
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: pipsnote-redis
    command: >
      redis-server --requirepass ${REDIS_PASSWORD}
      --maxmemory 512mb --maxmemory-policy allkeys-lru
    networks:
      - pipsnote_internal   # KHONG co ports — internal only
    volumes:
      - redis_data:/data
    restart: unless-stopped

  meilisearch:
    image: getmeili/meilisearch:v1.6
    container_name: pipsnote-meilisearch
    environment:
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY}
      MEILI_ENV: production
    networks:
      - pipsnote_internal   # KHONG co ports — internal only
    volumes:
      - meili_data:/meili_data
    restart: unless-stopped

networks:
  webphoto_backend:
    external: true   # network shared da ton tai tren VPS (owned boi shared-infra)
  pipsnote_internal:
    driver: bridge
    internal: true    # chan outbound — redis/meilisearch khong the ra internet du bi lo

volumes:
  redis_data:
  meili_data:
